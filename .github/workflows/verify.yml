name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Bun / WebKitGTK / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install native test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev pkg-config patchelf \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.1 \
            xvfb xauth

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Build frontend
        run: bun run build

      - name: Run all Bun tests with real WebKitGTK required
        # Ubuntu's python3-gi package belongs to /usr/bin/python3.
        run: PATH="/usr/bin:$PATH" xvfb-run -a bash scripts/test-webkit-required.sh

      - name: Test native Rust commands
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
